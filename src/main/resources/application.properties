# Puerto HTTP del servicio web.
server.port=8080

# Base de datos H2 persistente para fines académicos.
spring.datasource.url=jdbc:h2:file:./data/autenticaciondb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Crea o actualiza la tabla de usuarios según la entidad.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Consola web de H2 deshabilitada por defecto.
spring.h2.console.enabled=false
