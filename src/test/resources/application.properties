# Configuración de base de datos H2 en memoria exclusiva para el entorno de pruebas.
# Garantiza aislamiento total e impide la creación de archivos físicos en ./data.
spring.datasource.url=jdbc:h2:mem:autenticacion_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Esquema limpio para pruebas
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Consola web H2 deshabilitada en pruebas
spring.h2.console.enabled=false
